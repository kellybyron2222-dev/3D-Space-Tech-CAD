name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rapid main pushes cancel older runs so you don't get a failure email per commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace packages export types from dist/ — build before typecheck
      # (fresh CI checkout has no dist/, which makes @spacetech/* imports fail).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke STEP
        run: pnpm smoke:step

      - name: Validate bundled open CubeSat STEP
        run: node scripts/validate-step.mjs
